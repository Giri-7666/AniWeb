<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup</title>
    <link rel="stylesheet" href="signup.css">
    <script>
        // Function to validate password match
        function validatePassword() {
            // Get the values of the password fields
            const password = document.getElementById('pass').value;
            const confirmPassword = document.getElementById('retype').value;

            // Check if the passwords match
            if (password !== confirmPassword) {
                alert("Passwords do not match. Please try again.");
                return false; // Prevent form submission
            }
            return true; // Allow form submission
        }
    </script>

</head>
<body>
    
    <form action="aniwebhome. html" onsubmit="return validatePassword()">
        <h1>New to AniWeb 😊</h1>
        <h2>Create Account</h2>
        <div>
            <label for="name">Name</label>
            <input id="name" type="text" placeholder="Enetr your name" required>
        </div>
        <div>
            <label for="email">E-Mail ID</label>
            <input id="email" type="email" placeholder="Enter your E-mail Id" required>
        </div>
        <div>
            <label for="pass">Password</label>
            <input id="pass" type="password" placeholder="Enter your Password" required>
        </div>
        <div>
            <label for="retype">Conform Your Password</label>
            <input id="retype" type="password" placeholder="Re-type password" required>
        </div>
       <button type="submit">Create My Account</button>
    </form>
</body>
</html>
