<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="signup.css"> <!-- Linking to your stylesheet -->
</head>
<body>
    <form>
        <h1>Login to your Account 😊</h1>
        <div>
            <label for="username">Username/E-mail</label>
            <input id="username" name="username" placeholder="Enter Username/E-mail" type="email" required>
        </div>
        <div>
            <label for="pass">Password</label>
            <input id="pass" name="pass" placeholder="Enter Password" type="password" required>
        </div>
        <button type="submit">Login</button>
    </form>
    <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
</body>
</html>
